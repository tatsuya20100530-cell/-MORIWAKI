name: Instagram Daily Check

on:
  schedule:
    # JST 05:50 / 06:20 / 06:40. Multiple runs provide automatic recovery
    # before the consolidated 07:00 MORIWAKI report.
    - cron: '50 20 * * *'
    - cron: '20 21 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-daily-check
  cancel-in-progress: false

jobs:
  daily-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install report dependencies
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Run Instagram checker with automatic retry
        id: checker
        env:
          MORIWAKI_INSTAGRAM_PAGE_TOKEN: ${{ secrets.MORIWAKI_INSTAGRAM_PAGE_TOKEN }}
          MORIWAKI_IG_ID: '17841401126524039'
          TZ: Asia/Tokyo
        shell: bash
        run: |
          set -u
          TODAY="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          FILE="instagram-daily-checker/data/${TODAY}.csv"
          MIN_SUCCESS=12
          ok=0

          for attempt in 1 2 3; do
            echo "Instagram check attempt ${attempt}/3"
            if python instagram-daily-checker/check_instagram_actions.py; then
              if [ -s "$FILE" ]; then
                SUCCESS_COUNT="$(python -c 'import csv,sys; print(sum(1 for r in csv.DictReader(open(sys.argv[1], encoding="utf-8")) if r.get("result") == "OK"))' "$FILE")"
                echo "Successful accounts: ${SUCCESS_COUNT}/20"
                if [ "$SUCCESS_COUNT" -ge "$MIN_SUCCESS" ]; then
                  ok=1
                  break
                fi
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "Instagram daily check failed quality gate after 3 attempts." >&2
            exit 1
          fi

      - name: Generate Excel report
        env:
          TZ: Asia/Tokyo
        run: python instagram-daily-checker/create_excel.py

      - name: Write success health status
        if: success()
        run: |
          mkdir -p instagram-daily-checker/status
          TODAY="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          NOW="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          printf 'date,result,checked_at,run_id\n%s,success,%s,%s\n' "$TODAY" "$NOW" "${{ github.run_id }}" > instagram-daily-checker/status/latest.csv

      - name: Write failure health status
        if: failure()
        run: |
          mkdir -p instagram-daily-checker/status
          TODAY="$(TZ=Asia/Tokyo date '+%Y-%m-%d')"
          NOW="$(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M:%S JST')"
          printf 'date,result,checked_at,run_id\n%s,failure,%s,%s\n' "$TODAY" "$NOW" "${{ github.run_id }}" > instagram-daily-checker/status/latest.csv

      - name: Commit updated data, reports and health status
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add instagram-daily-checker/data instagram-daily-checker/reports instagram-daily-checker/status
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m "chore: update Instagram report $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
