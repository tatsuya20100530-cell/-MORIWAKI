name: One-off daily PDFs 2026-09-05

on:
  push:
    paths:
      - '.github/workflows/oneoff-daily-pdfs-2026-09-05.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk poppler-utils
          python -m pip install --disable-pip-version-check pillow pypdf

      - name: Generate flat image PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from pypdf import PdfReader

          OUT = Path("daily-artifacts/2026-09-05")
          OUT.mkdir(parents=True, exist_ok=True)
          FONT_REG = "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc"
          FONT_BOLD = "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc"

          def f(size, bold=False):
              return ImageFont.truetype(FONT_BOLD if bold else FONT_REG, size=size, index=0)

          INK = "#17212B"
          MUTED = "#58636F"
          RED = "#9E2A2B"
          BLUE = "#174B70"
          PALE = "#F5F1E8"
          WHITE = "#FFFFFF"
          GOLD = "#B28A44"

          def wrapped(draw, text, font, width):
              lines = []
              for para in str(text).split("\n"):
                  if not para:
                      lines.append("")
                      continue
                  line = ""
                  for ch in para:
                      trial = line + ch
                      if line and draw.textlength(trial, font=font) > width:
                          lines.append(line)
                          line = ch
                      else:
                          line = trial
                  if line:
                      lines.append(line)
              return lines

          def paragraph(draw, text, x, y, font, width, fill=INK, gap=8):
              for line in wrapped(draw, text, font, width):
                  draw.text((x, y), line, font=font, fill=fill)
                  y += font.size + gap
              return y

          def rule(draw, y, x1=74, x2=1166, color=GOLD, w=3):
              draw.line((x1, y, x2, y), fill=color, width=w)

          def base_page(kicker, page_no):
              im = Image.new("RGB", (1240, 1754), PALE)
              d = ImageDraw.Draw(im)
              d.rectangle((0, 0, 1240, 112), fill=INK)
              d.text((66, 27), "MORIWAKI MORNING NEWS", font=f(30, True), fill=WHITE)
              d.text((935, 32), "2026.09.05 SAT", font=f(21, True), fill="#E8D6AE")
              d.text((66, 127), kicker, font=f(19, True), fill=RED)
              d.text((1095, 1685), f"{page_no} / 6", font=f(18), fill=MUTED)
              d.text((66, 1685), "発行 2026年9月5日 朝 ｜ 数値は発表時刻で変わる場合があります", font=f(17), fill=MUTED)
              return im, d

          def title(d, text, y, size=42):
              y = paragraph(d, text, 66, y, f(size, True), 1100, INK, 10)
              rule(d, y + 7)
              return y + 28

          def block(d, label, body, y, accent=BLUE, hsize=27, bsize=24):
              d.rounded_rectangle((66, y, 1174, y + 44), radius=8, fill=accent)
              d.text((84, y + 6), label, font=f(hsize, True), fill=WHITE)
              y += 58
              y = paragraph(d, body, 78, y, f(bsize), 1080, INK, 10)
              return y + 20

          pages = []

          # 1面
          im, d = base_page("1面 ｜ 命を守る情報を最優先", 1)
          y = title(d, "種子島・屋久島で線状降水帯\n大雨が長引くおそれ", 190, 48)
          d.rounded_rectangle((66, y, 1174, y + 120), radius=14, fill="#E8DED0")
          d.text((88, y + 19), "5日午前2時48分、再び発生", font=f(31, True), fill=RED)
          d.text((88, y + 67), "土砂災害・川の氾濫に警戒。避難情報を確認。", font=f(24, True), fill=INK)
          y += 150
          y = block(d, "何が起きた？", "台風24号と秋雨前線の影響で、鹿児島県の種子島・屋久島地方に線状降水帯が発生しました。4日夜にも発生しており、屋久島では1時間に約120ミリの猛烈な雨が報告されています。", y, RED)
          y = block(d, "背景を解説", "台風が運ぶ暖かく湿った空気が秋雨前線へ流れ込み、同じ場所に発達した雨雲がかかり続けています。台風の動きが遅く、雨の期間が長くなる心配があります。", y)
          y = block(d, "今後の注目", "5日夜までの予想雨量は九州南部250ミリ、奄美地方180ミリ。6日は雨の範囲が本州へ広がり、7日にかけ近畿から関東甲信でも大雨のおそれがあります。予報は必ず最新情報で確認してください。", y, GOLD)
          d.rounded_rectangle((66, 1390, 1174, 1638), radius=12, outline=RED, width=4, fill="#FFF9F0")
          d.text((86, 1410), "今日の行動", font=f(27, True), fill=RED)
          paragraph(d, "・危険な場所では、暗くなる前に安全確保\n・川や用水路、崖へ近づかない\n・枚方は警報・注意報なしでも、外出前に雨雲を確認", 90, 1455, f(24, True), 1040, INK, 11)
          pages.append(im)

          # 世界1〜3
          im, d = base_page("世界の今日 TOP5 ｜ 1〜3位", 2)
          y = title(d, "世界：人命と国際社会への影響", 185, 40)
          y = block(d, "1　米国・イランの攻撃、さらに緊張", "何が起きた？　米国はイランへの軍事・経済圧力を強め、トランプ米大統領は地下核関連施設への追加攻撃の可能性に言及しました。APは米攻撃で結婚式前の民間人に死傷者が出たと報道。\n背景　ホルムズ海峡は世界の石油輸送の重要な海の道です。\n今後　民間人被害の調査、報復の拡大、船舶と原油価格を確認します。死傷者数は報道時点で差があります。", y, RED, 25, 23)
          y = block(d, "2　ネパール洪水、9日ぶりに2人救出", "何が起きた？　水力発電所のトンネルから作業員2人が生存救出されました。APはネパールで少なくとも1287人死亡、5000人超が行方不明と報じています。\n背景　氷河崩落が大規模な洪水・土石流を起こし、道路や通信も壊れました。\n今後　トンネル内の救助、二次災害、変動する被害人数に注意します。", y, BLUE, 25, 23)
          y = block(d, "3　キーウ中心部、治安機関本部を攻撃", "何が起きた？　ロシアの無人機がウクライナ保安局本部を攻撃。APは12人負傷と伝えました。\n背景　米国の仲介役がモスクワとキーウを訪れる予定のなか、攻撃が続いています。\n今後　民間人被害、停戦中の攻撃停止、安全保証の協議を見ます。", y, GOLD, 25, 23)
          pages.append(im)

          # 世界4〜5
          im, d = base_page("世界の今日 TOP5 ｜ 4〜5位・世界経済", 3)
          y = title(d, "災害と物価、日本の暮らしにも影響", 185, 40)
          y = block(d, "4　中国沿岸、台風で洪水・大規模避難", "何が起きた？　台風サウデルの大雨で福建・広東などに洪水が発生し、福建だけで8万3000人超が避難しました。建物倒壊や行方不明者も報じられています。\n背景　学校・交通を止めて対応していますが、川の増水と土砂災害が続くおそれがあります。\n今後　安否確認、避難の長期化、農産物や物流への影響を見ます。", y, RED, 25, 23)
          y = block(d, "5　世界の食料価格、2022年以来の高水準", "何が起きた？　国連FAOの8月食料価格指数は133.3。7月の130.8から上昇しました。\n背景　異常気象、ウクライナ・イラン情勢、黒海の輸送混乱で穀物・油・砂糖などが上がっています。\n今後　パン・麺・油・乳製品の仕入れ価格と、各国の備蓄を確認します。", y, BLUE, 25, 23)
          d.rounded_rectangle((66, y + 5, 1174, y + 315), radius=12, fill="#E8DED0")
          d.text((86, y + 25), "世界経済メモ", font=f(28, True), fill=INK)
          paragraph(d, "・北海ブレント原油：1バレル92.68ドルで週を終える\n・WTI原油：91.48ドル\n・中東の海上輸送への不安で、燃料・電気・配送費に上昇圧力\n・世界の食料価格上昇は、日本の輸入原料にも波及する可能性", 90, y + 75, f(24), 1030, INK, 11)
          pages.append(im)

          # 日本1〜3
          im, d = base_page("日本の今日 TOP5 ｜ 1〜3位", 4)
          y = title(d, "日本：大雨・感染症・国の予算", 185, 40)
          y = block(d, "1　種子島・屋久島で線状降水帯", "何が起きた？　5日午前2時48分に再び線状降水帯が発生し、災害の危険度が急激に高まりました。\n背景　台風24号が秋雨前線へ湿った空気を送り続けています。\n今後　九州南部の土砂災害と氾濫、6日以降の本州への雨域拡大に注意します。", y, RED, 25, 23)
          y = block(d, "2　インフルエンザ、前週の約1.5倍", "何が起きた？　8月31日までの1週間は、1医療機関あたり全国平均1.76人。前週1.11人から増え、前年同期の約5倍です。\n背景　28都道府県で流行の目安「1人」を超えました。\n今後　手洗い、換気、体調不良時の早めの休養。接客時も無理をしないことが大切です。", y, BLUE, 25, 23)
          y = block(d, "3　来年度予算の要求、143.1兆円", "何が起きた？　国の2027年度予算要求が143.1兆円となり、コロナ禍並みの規模です。国債の利払いなどは過去最大36.64兆円。\n背景　AI・半導体・経済安全保障への投資と金利上昇が重なっています。\n今後　実際の予算額、国債発行、将来負担を確認します。", y, GOLD, 25, 23)
          pages.append(im)

          # 日本4〜5
          im, d = base_page("日本の今日 TOP5 ｜ 4〜5位・暮らし", 5)
          y = title(d, "円相場と政治、家計・事業に直結", 185, 40)
          y = block(d, "4　政府、円の急な動きを強く警戒", "何が起きた？　政府の為替責任者は、行き過ぎた円安に対応できる姿勢を改めて示しました。4日の海外市場では1ドル156円台。\n背景　日米の金利差、日銀の利上げ観測、投資家の動きで相場が大きく変わっています。\n今後　輸入品・薬剤原料・電気代への影響と、政府・日銀の対応を見ます。", y, RED, 25, 23)
          y = block(d, "5　内閣改造・党人事を9月中旬に調整", "何が起きた？　高市首相は9月中旬にも内閣改造と自民党役員人事を行う方向です。\n背景　食料品の消費税率引き下げを含む税制方針を15日にも決め、その後に人事を進める見通しです。\n今後　物価対策、税制、防衛・社会保障の担当者と政策継続性に注目します。", y, BLUE, 25, 23)
          d.rounded_rectangle((66, y + 10, 1174, y + 350), radius=12, fill="#E8DED0")
          d.text((86, y + 30), "美容室で今日確認すること", font=f(28, True), fill=INK)
          paragraph(d, "1. 発熱・せきがあるスタッフは無理をせず共有\n2. ドアノブ・タブレット・クロス周りを清潔に\n3. 薬剤、店販、電気・配送費を月単位で確認\n4. 大雨地域から来る商品や荷物の遅延を想定", 90, y + 83, f(25), 1030, INK, 12)
          pages.append(im)

          # 最終面
          im, d = base_page("最終面 ｜ 経済・美容・枚方の天気・美容師目線", 6)
          y = title(d, "枚方 31℃　曇り時々晴れ・にわか雨", 180, 39)
          d.rounded_rectangle((66, y, 1174, y + 155), radius=14, fill=BLUE)
          d.text((88, y + 18), "最高31℃　最低23℃　降水確率40％", font=f(31, True), fill=WHITE)
          d.text((88, y + 73), "7時台確認：枚方市に警報・注意報の発表なし", font=f(24, True), fill="#E8D6AE")
          d.text((88, y + 112), "急な雨に備え、傘・入口の足元・湿気対策を。", font=f(22), fill=WHITE)
          y += 184
          y = block(d, "経済", "原油高・世界の食料価格上昇・円相場の変動が重なっています。サロンでは薬剤、店販、容器、電気、配送費を一度に判断せず、月ごとの実績で確認します。", y, RED, 24, 22)
          y = block(d, "美容", "全国ニュース級の大きな美容速報は見当たりません。今日は、雨上がりの蒸し暑さによる頭皮のべたつきと、毛先の広がり対策を優先します。", y, GOLD, 24, 22)
          y = block(d, "今日、お客様に話せるひとこと", "「雨上がりで蒸す日は、頭皮と根元の汗をタオルで押さえてから冷風を当てると、べたつきと根元のつぶれを整えやすいですよ。」", y, BLUE, 24, 22)
          y = block(d, "今日やること", "1. 換気と冷房を両立し、スタッフの水分補給を確認\n2. 入口・床・傘置き場を確認\n3. HPBで『蒸し暑い日の頭皮・根元リセット』を発信", y, RED, 24, 22)

          d.text((66, 1320), "主要情報源", font=f(23, True), fill=INK)
          sources = [
              "Reuters 9/4：米国・イラン、ネパール救助、中国洪水、原油、世界食料価格",
              "AP 9/4：ネパールのトンネル救助、キーウ攻撃、イラン民間人被害",
              "テレビ朝日 9/5：種子島・屋久島の線状降水帯",
              "テレビ朝日 9/4：インフルエンザ患者数、内閣改造",
              "Reuters 9/4：日本の予算要求、円相場",
              "気象庁・Toshin 9/5：枚方の警報・天気"
          ]
          yy = 1360
          for s in sources:
              yy = paragraph(d, "・" + s, 76, yy, f(18), 1080, MUTED, 5)
          pages.append(im)

          news_pdf = OUT / "時事新聞_2026-09-05_朝刊.pdf"
          pages[0].save(news_pdf, "PDF", resolution=150.0, save_all=True, append_images=pages[1:])

          # Google 1ページ
          W, H = 1754, 1240
          gim = Image.new("RGB", (W, H), "#F4F1EA")
          gd = ImageDraw.Draw(gim)
          gd.rectangle((0, 0, W, 120), fill=INK)
          gd.text((60, 27), "Googleビジネス 6店舗 日次チェック", font=f(41, True), fill=WHITE)
          gd.text((1390, 38), "2026.09.05", font=f(27, True), fill="#E8D6AE")
          gd.rounded_rectangle((60, 155, 1694, 285), radius=14, fill=WHITE, outline="#D3C7B2", width=3)
          gd.text((88, 176), "口コミ合計 276件", font=f(34, True), fill=BLUE)
          gd.text((530, 176), "前日比 +1件", font=f(34, True), fill=RED)
          gd.text((915, 176), "投稿増加合計：算出不可", font=f(28, True), fill=INK)
          gd.text((88, 231), "東寝屋川店が41件→42件。Googleマップ公開表示を7:46 JSTに確認。", font=f(24), fill=MUTED)

          cols = [60, 410, 720, 1030, 1335, 1694]
          top = 330
          row_h = 105
          headers = ["店舗", "前日の口コミ数", "現在の口コミ数", "口コミ前日比", "投稿前日比"]
          for i in range(5):
              gd.rectangle((cols[i], top, cols[i+1], top+80), fill=INK, outline=WHITE, width=2)
              tw = gd.textlength(headers[i], font=f(23, True))
              gd.text(((cols[i]+cols[i+1]-tw)/2, top+23), headers[i], font=f(23, True), fill=WHITE)
          rows = [
              ("交野店", "51", "51", "+0件", "確認不可"),
              ("宮之阪店", "51", "51", "+0件", "確認不可"),
              ("凪店", "45", "45", "+0件", "確認不可"),
              ("東寝屋川店", "41", "42", "+1件", "確認不可"),
              ("藤が尾店", "68", "68", "+0件", "確認不可"),
              ("河内磐船店", "19", "19", "+0件", "確認不可"),
          ]
          for r, row in enumerate(rows):
              y0 = top + 80 + r*row_h
              fill = "#FFFDF8" if r % 2 == 0 else "#E9E3D8"
              if r == 3:
                  fill = "#FCE8E2"
              for i, val in enumerate(row):
                  gd.rectangle((cols[i], y0, cols[i+1], y0+row_h), fill=fill, outline="#B7AA96", width=2)
                  font = f(27, True) if i in (0,3) else f(27)
                  color = RED if (r == 3 and i in (2,3)) else INK
                  tw = gd.textlength(val, font=font)
                  gd.text(((cols[i]+cols[i+1]-tw)/2, y0+33), val, font=font, fill=color)
          gd.rounded_rectangle((60, 1050, 1694, 1165), radius=10, fill=WHITE, outline="#D3C7B2", width=2)
          gd.text((82, 1071), "注：投稿前日比は公開履歴から正確な日次比較ができないため「確認不可」。", font=f(23), fill=INK)
          gd.text((82, 1112), "出典：Googleマップ／Googleビジネスプロフィール公開表示。過去値・第三者サイト値は不使用。", font=f(21), fill=MUTED)
          google_pdf = OUT / "Googleビジネス6店舗チェック_2026-09-05.pdf"
          gim.save(google_pdf, "PDF", resolution=150.0)

          assert len(PdfReader(str(news_pdf)).pages) == 6
          assert len(PdfReader(str(google_pdf)).pages) == 1
          assert news_pdf.stat().st_size > 100000
          assert google_pdf.stat().st_size > 30000
          print(news_pdf, news_pdf.stat().st_size)
          print(google_pdf, google_pdf.stat().st_size)
          PY

      - name: Validate rendered pages
        run: |
          mkdir -p daily-artifacts/2026-09-05/qa
          pdftoppm -png -r 100 daily-artifacts/2026-09-05/時事新聞_2026-09-05_朝刊.pdf daily-artifacts/2026-09-05/qa/news-page >/dev/null 2>&1
          pdftoppm -png -r 100 daily-artifacts/2026-09-05/Googleビジネス6店舗チェック_2026-09-05.pdf daily-artifacts/2026-09-05/qa/google-page >/dev/null 2>&1
          test "$(find daily-artifacts/2026-09-05/qa -name 'news-page-*.png' | wc -l)" -eq 6
          test "$(find daily-artifacts/2026-09-05/qa -name 'google-page-*.png' | wc -l)" -eq 1

      - name: Commit PDFs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add daily-artifacts/2026-09-05
          git commit -m 'docs: add MORIWAKI daily PDFs and QA pages for 2026-09-05'
          git pull --rebase origin main
          git push origin HEAD:main
